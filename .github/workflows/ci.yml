name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit tests, Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -I tests/test_backup_vault.py -v

  lint:
    name: ShellCheck and byte-compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh uninstall.sh tests/integration.sh system/motd/60-backup-vault
      - run: python3 -c "import ast, sys; ast.parse(open('backup-vault').read())"

  integration:
    name: Install and use on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - run: sudo bash tests/integration.sh
