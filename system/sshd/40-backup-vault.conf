# SFTP Backup Vault (https://github.com/MahdiGraph/SFTP-Backup-Vault): the rules of the backup accounts.
# Installed by install.sh, replaced on upgrade: keep your own settings in other files of this folder.
# Who may log in from which address is in 41-backup-vault-access.conf, written by `backup-vault apply`.
#
# Backup accounts (the group sftp_backups) get SFTP only, shut in /var/backups/sftp/<account>, where
# they can only add files under upload/. Refused: reading (downloads), deleting files or folders,
# links and server-side copies. Every file and every refusal is logged (/var/log/auth.log, through
# the chroot's dev/log), and passwords are accepted for them unless installed with --keys-only.
Match Group sftp_backups
    ChrootDirectory /var/backups/sftp/%u
    ForceCommand internal-sftp -l VERBOSE -f AUTHPRIV -u 0077 -P read,readlink,remove,rmdir,symlink,hardlink,copy-data
    AuthorizedKeysFile /etc/backup-vault/keys/%u
    PasswordAuthentication yes
    DisableForwarding yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no
    PermitTTY no
    PermitUserRC no
    PermitListen none
    PermitOpen none
    MaxAuthTries 3
    MaxSessions 4
